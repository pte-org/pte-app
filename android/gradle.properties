org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler crashes on Windows when the project and the
# pub-cache (plugin sources) live on different drive letters — it can't
# compute a relative path between them. Affects any Windows dev whose
# project isn't on the same drive as %LOCALAPPDATA%\Pub\Cache.
kotlin.incremental=false
